[project]
name = "PCGen"
version = "2.0"
description = "Fully parallelizable point cloud generative model."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "drytorch>=0.1.0",
    "geomloss>=0.2.6",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "numpy>=2.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pykeops>=2.2.3",
    "requests>=2.28.1",
    "scikit-learn>=1.9.1",
    "torch~=2.14.0",
    "tqdm>=4.66.5",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
emd = ["structural-losses"]
finetune = ["optuna>=4.6.0", "plotly>=7.1.0"]
profile = ["deepspeed>=0.18.0"]
track_all = [
    "sqlalchemy>=2.0.0",
    "tensorboard>=2.20.0",
    "wandb>=0.23.1",
]
visualize = ["matplotlib>=3.11.1", "pyvista>=0.46.4"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff==0.17.1",
]

[tool.basedpyright]
exclude = ["external", "reference", "scratch", "tests", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.uv.sources]
structural-losses = { path = "external/pytorch_structural_losses" }
